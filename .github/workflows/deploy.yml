name: Deploy PickleFund

# Pipeline: test -> build+push images to GHCR -> SSH deploy (VPS only pulls).
# Building on GitHub runners removes the small-VPS OOM from `docker compose build`.
# GHCR packages picklefund-backend / picklefund-frontend must be PUBLIC (VPS pulls
# anonymously; a stored credential would make GHCR deny a public pull).

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Run backend tests
        run: cd backend && npm test -- --passWithNoTests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/picklefund-backend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/picklefund-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.IMAGE_BASE }}/picklefund-frontend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/picklefund-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS (pull prebuilt images)
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GIT_SHA
          script: |
            set -e
            REPO_DIR=/opt/picklefund
            SHORT_SHA="${GIT_SHA:0:7}"

            # ── Telegram helper (silent if secrets not configured) ─────
            send_telegram() {
              local msg="$1"
              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
                curl -s -X POST \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                  --data-urlencode "text=${msg}" \
                  -d "parse_mode=HTML" \
                  >/dev/null 2>&1 || true
              fi
            }

            cd "$REPO_DIR"

            # ── 0. Dung lượng đĩa TRƯỚC deploy (theo dõi phình đĩa VPS 38G) ──
            echo "=== Disk before deploy ==="; df -h /
            echo "Backups dir: $(du -sh "$REPO_DIR"/backups 2>/dev/null | cut -f1) ($(ls -1 "$REPO_DIR"/backups/picklefund_*.sql 2>/dev/null | wc -l) files)"

            # ── 1. Save previous commit for rollback ──────────────────
            PREVIOUS_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "Previous commit: ${PREVIOUS_COMMIT:-none}"
            echo "$PREVIOUS_COMMIT" > /tmp/picklefund-last-commit.txt

            send_telegram "$(printf '🚀 PickleFund deploy started\nCommit: %s' "$SHORT_SHA")"

            # ── 2. Sync to origin/main (no git pull) ──────────────────
            git fetch origin main
            TARGET_SHA=$(git rev-parse origin/main)
            echo "Target commit: $TARGET_SHA"
            git reset --hard origin/main
            git clean -fd \
              -e .env \
              -e .env.production \
              -e "*.sql" \
              -e "backup_*.sql" \
              -e "ssl/"

            # ── 3. Load production env vars for DB credentials ────────
            set -a
            [ -f "$REPO_DIR/.env.production" ] && source "$REPO_DIR/.env.production"
            [ -f "$REPO_DIR/.env" ]            && source "$REPO_DIR/.env"
            set +a

            # ── 4. Database backup before any container change ────────
            mkdir -p "$REPO_DIR/backups"
            BACKUP_FILE="$REPO_DIR/backups/picklefund_$(date +%Y%m%d_%H%M%S).sql"

            echo "Creating database backup: $BACKUP_FILE"
            docker compose exec -T postgres pg_dump \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" \
              > "$BACKUP_FILE"

            if [ ! -s "$BACKUP_FILE" ]; then
              echo "ERROR: Backup file is empty or missing — aborting deploy."
              rm -f "$BACKUP_FILE"
              send_telegram "$(printf '🚨 PickleFund deploy aborted\nDatabase backup failed.\nManual intervention required.')"
              exit 1
            fi
            BACKUP_SIZE=$(du -sh "$BACKUP_FILE" | cut -f1)
            echo "Backup OK: $(basename "$BACKUP_FILE") ($BACKUP_SIZE)"

            # ── 4b. Sao lưu chứng chỉ SSL nginx (KHÔNG nằm trong git/volume; mất là phải
            #        xin cấp lại). Tar vào cùng thư mục backups để rotate & (bước 6) đẩy offsite.
            SSL_DIR="$REPO_DIR/nginx/ssl"
            if [ -d "$SSL_DIR" ] && [ -n "$(ls -A "$SSL_DIR" 2>/dev/null)" ]; then
              SSL_BACKUP="$REPO_DIR/backups/ssl_$(date +%Y%m%d_%H%M%S).tgz"
              if tar czf "$SSL_BACKUP" -C "$REPO_DIR/nginx" ssl 2>/dev/null && [ -s "$SSL_BACKUP" ]; then
                echo "SSL backup OK: $(basename "$SSL_BACKUP") ($(du -sh "$SSL_BACKUP" | cut -f1))"
              else
                rm -f "$SSL_BACKUP"; echo "(SSL backup bỏ qua — không tar được, không chặn deploy)"
              fi
            else
              echo "(Không có nginx/ssl để sao lưu — bỏ qua)"
            fi

            # ── 4c. Stage bản backup MỚI NHẤT (DB + SSL) cho offsite. Bước sau (chạy trên
            #        runner) sẽ scp thư mục này về & upload GitHub Artifact (giữ 30 ngày).
            #        Stage NGAY sau khi tạo backup (trước khi đổi container) → dù deploy có
            #        rollback thì vẫn có bản snapshot tiền-deploy để đẩy offsite.
            OFFSITE_DIR="$REPO_DIR/backups/_offsite"
            rm -rf "$OFFSITE_DIR"; mkdir -p "$OFFSITE_DIR"
            cp -f "$BACKUP_FILE" "$OFFSITE_DIR"/ 2>/dev/null || true
            LATEST_SSL=$(ls -1t "$REPO_DIR"/backups/ssl_*.tgz 2>/dev/null | head -1)
            [ -n "$LATEST_SSL" ] && cp -f "$LATEST_SSL" "$OFFSITE_DIR"/ 2>/dev/null || true
            echo "Offsite staged: $(ls -1 "$OFFSITE_DIR" 2>/dev/null | wc -l) file(s) trong $OFFSITE_DIR"

            # ── 5. Pull prebuilt images & restart (no compile on VPS) ─
            # Images are PUBLIC on GHCR -> pull anonymously; a stale credential
            # would make GHCR deny a public pull, so clear it first.
            docker logout ghcr.io >/dev/null 2>&1 || true
            export IMAGE_TAG="$GIT_SHA"
            echo "Pulling images at IMAGE_TAG=$IMAGE_TAG"

            # ── Dọn image cũ TRƯỚC KHI PULL (chống "no space left" lúc giải nén) ──
            # Chạy trong khi container CŨ vẫn đang chạy (down xảy ra SAU pull) → image
            # của app đang chạy được tham chiếu nên KHÔNG bị xoá; chỉ dọn image deploy cũ
            # không còn dùng. Deploy dồn dập trong ngày (image <72h) vẫn được giải phóng.
            docker image prune -f >/dev/null 2>&1 || true   # dangling: luôn dọn
            # Đo phân vùng ĐẦY NHẤT trong số /, /var/lib/containerd, /var/lib/docker. Box này
            # bind-mount /var/lib/containerd sang Hetzner Volume 40G (/dev/sdb) — image Docker
            # nằm ở đó, KHÔNG phải sda1 ('/'). Trước đây chỉ canh 'df /' (sda1) nên prune mạnh
            # không bao giờ chạy dù ổ image thật đầy → phải lấy MAX các phân vùng liên quan.
            disk_use() { df -P / /var/lib/containerd /var/lib/docker 2>/dev/null | awk 'NR>1{gsub(/%/,"",$5); if($5+0>m)m=$5+0} END{print m+0}'; }
            DISK_PRE=$(disk_use)
            echo "Disk (phân vùng đầy nhất) trước pull: ${DISK_PRE}%"
            if [ "${DISK_PRE:-0}" -ge 70 ]; then
              echo "Disk ${DISK_PRE}% >= 70% — dọn MẠNH mọi image không dùng trước khi pull (rollback vẫn re-pull GHCR được)"
              docker image prune -af >/dev/null 2>&1 || true
              docker builder prune -af >/dev/null 2>&1 || true
            fi

            docker compose pull backend frontend
            docker compose down --remove-orphans
            docker compose up -d

            echo "Waiting for services to initialize..."
            sleep 30

            # ── 6. Health checks ──────────────────────────────────────
            HEALTH_OK=true

            if ! curl -sf https://api.picklefund.uk/health >/dev/null 2>&1; then
              echo "ERROR: Backend health check failed"
              docker compose ps
              docker compose logs backend --tail=100
              HEALTH_OK=false
            fi

            if [ "$HEALTH_OK" = "true" ]; then
              if ! curl -sf https://app.picklefund.uk/ >/dev/null 2>&1; then
                echo "ERROR: Frontend health check failed"
                docker compose ps
                docker compose logs nginx --tail=100
                HEALTH_OK=false
              fi
            fi

            # ── 7. Success ────────────────────────────────────────────
            if [ "$HEALTH_OK" = "true" ]; then
              BACKUP_NAME=$(basename "$BACKUP_FILE")
              # Tự dọn ảnh cũ (>3 ngày) để tránh ĐẦY ĐĨA VPS 38G (chung với AICP) — giữ vài
              # bản gần nhất cho rollback. Best-effort, không chặn deploy nếu lỗi.
              # Đĩa căng (>=75%) → prune MẠNH (mọi image/build-cache không dùng) để giải phóng
              # ngay; rollback vẫn re-pull được từ GHCR (public). Hạ ngưỡng 85→75 vì nhiều lần
              # deploy/ngày làm image tích lũy nhanh (đĩa 38G dùng chung). Bình thường giữ cửa sổ 24h.
              disk_use() { df -P / /var/lib/containerd /var/lib/docker 2>/dev/null | awk 'NR>1{gsub(/%/,"",$5); if($5+0>m)m=$5+0} END{print m+0}'; }
              DISK_USE=$(disk_use)
              if [ "${DISK_USE:-0}" -ge 75 ]; then
                echo "Disk (phân vùng đầy nhất) ${DISK_USE}% >= 75% — aggressive prune (all unused images + build cache)"
                docker image prune -af >/dev/null 2>&1 || true
                docker builder prune -af >/dev/null 2>&1 || true
                docker container prune -f >/dev/null 2>&1 || true
              else
                echo "Pruning old images (keep last 24h)..."
                docker image prune -af --filter "until=24h" >/dev/null 2>&1 || true
                docker builder prune -f --filter "until=24h" >/dev/null 2>&1 || true
              fi
              # Dọn backup DB cũ — giữ 14 bản gần nhất (mỗi deploy tạo 1 file ~3M, TRƯỚC ĐÂY
              # không xoá nên phình đĩa dần). Best-effort, không chặn deploy.
              echo "Trimming old DB backups (keep last 14)..."
              ls -1t "$REPO_DIR"/backups/picklefund_*.sql 2>/dev/null | tail -n +15 | xargs -r rm -f || true
              echo "Trimming old SSL backups (keep last 14)..."
              ls -1t "$REPO_DIR"/backups/ssl_*.tgz 2>/dev/null | tail -n +15 | xargs -r rm -f || true
              echo "=== Disk after cleanup (root + ổ image Docker) ==="; df -h / /var/lib/containerd /var/lib/docker 2>/dev/null | awk 'NR==1 || !seen[$1]++'
              echo "Backups dir: $(du -sh "$REPO_DIR"/backups 2>/dev/null | cut -f1) ($(ls -1 "$REPO_DIR"/backups/picklefund_*.sql 2>/dev/null | wc -l) files)"
              send_telegram "$(printf '✅ PickleFund deploy success\nCommit: %s\nAPI: OK\nFrontend: OK\nBackup: %s' "$SHORT_SHA" "$BACKUP_NAME")"
              echo "Deployment successful."
              exit 0
            fi

            # ── 8. Rollback (re-pull previous image tag) ──────────────
            echo "Health check failed — initiating rollback to $PREVIOUS_COMMIT"
            send_telegram "$(printf '⚠️ PickleFund deploy failed, rolling back...\nFailed commit: %s\nRolling back to: %s' "$SHORT_SHA" "${PREVIOUS_COMMIT:0:7}")"

            if [ -z "$PREVIOUS_COMMIT" ]; then
              echo "ERROR: No previous commit recorded — cannot rollback."
              send_telegram "$(printf '🚨 PickleFund deploy failed, rollback failed\nNo previous commit recorded.\nManual intervention required.')"
              exit 1
            fi

            export IMAGE_TAG="$PREVIOUS_COMMIT"
            echo "Rolling back to IMAGE_TAG=$IMAGE_TAG"
            # Previous image may already be local; pull is best-effort (it may not
            # exist if the previous deploy predates GHCR — then rely on local image).
            docker compose pull backend frontend || echo "(using local previous image if present)"
            docker compose down --remove-orphans
            docker compose up -d
            sleep 30

            ROLLBACK_OK=true
            curl -sf https://api.picklefund.uk/health >/dev/null 2>&1 || ROLLBACK_OK=false
            curl -sf https://app.picklefund.uk/ >/dev/null 2>&1      || ROLLBACK_OK=false

            if [ "$ROLLBACK_OK" = "true" ]; then
              send_telegram "$(printf '⚠️ PickleFund deploy failed, rollback success\nFailed commit: %s\nRolled back to: %s' "$SHORT_SHA" "${PREVIOUS_COMMIT:0:7}")"
              echo "Rollback successful."
            else
              send_telegram "$(printf '🚨 PickleFund deploy failed, rollback failed\nManual intervention required.')"
              echo "CRITICAL: Rollback also failed. Manual intervention required."
            fi

            exit 1

      # ── (2) OFFSITE BACKUP: kéo bản backup mới nhất (DB + SSL) từ VPS về runner rồi
      #        upload GitHub Artifact (giữ 30 ngày). Chạy dù deploy thành công hay rollback
      #        (if: always) để luôn có 1 bản snapshot tiền-deploy nằm NGOÀI máy chủ.
      #        LƯU Ý: artifact chứa dữ liệu thành viên thật — chỉ người có quyền đọc Actions
      #        của repo (private) tải được; giữ 30 ngày, không phải kho lưu trữ dài hạn.
      - name: Kéo backup mới nhất từ VPS về runner (offsite)
        if: always()
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p offsite
          sshpass -e scp -o StrictHostKeyChecking=no -P "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/picklefund/backups/_offsite/*" offsite/ \
            || echo "Không kéo được file offsite (có thể deploy abort trước khi tạo backup)."
          echo "Offsite files on runner:"; ls -lh offsite/ 2>/dev/null || true

      - name: Upload backup offsite lên GitHub Artifact (giữ 30 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-backup-${{ github.sha }}
          path: offsite/
          retention-days: 30
          if-no-files-found: warn
