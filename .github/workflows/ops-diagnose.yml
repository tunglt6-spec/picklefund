# Chẩn đoán VPS CHỈ ĐỌC (không sửa gì): đĩa, Docker, hàng đợi việc. Chạy tay: Actions → Ops diagnose.
name: Ops diagnose
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "=== df ==="; df -h / | tail -1; docker system df
            echo "=== du top ==="; du -xsh /var/lib/docker /var/lib/containerd /var/log /opt/picklefund /root /home /var/lib/postgresql /tmp 2>/dev/null | sort -rh
            echo "=== containerd top ==="; du -xh --max-depth=3 /var/lib/containerd 2>/dev/null | sort -rh | head -6
            echo "=== journal ==="; journalctl --disk-usage
            DB=$(docker ps --format '{{.Names}}' | grep -i db | head -1)
            Q() { docker exec "$DB" sh -c "psql -U \${POSTGRES_USER:-picklefund} -d \${POSTGRES_DB:-picklefund} -At -F ' | ' -c \"$1\""; }
            echo "=== migration ==="; Q "select migration_name, finished_at is not null as ok from _prisma_migrations order by started_at desc limit 2"; Q "select unnest(enum_range(null::\"PaymentGateway\"))"; Q "select column_name from information_schema.columns where table_name='payment_orders' and column_name in ('method','months','reference','note')"
            echo "=== queue ==="; Q "select (select count(*) from workflow_runs where status in ('PENDING','RUNNING','WAITING_APPROVAL')) wf, (select count(*) from ai_actions where status in ('PENDING_APPROVAL','RETRY_PENDING')) ai, (select count(*) from ai_actions where status='EXPIRED') expired"
            echo "=== pending by type ==="; Q "select status, trigger_type, count(*), min(created_at)::date from workflow_runs where status in ('PENDING','RUNNING','WAITING_APPROVAL') group by 1,2 order by 3 desc"
            echo "=== images ==="; docker images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}' | head -20
            echo "=== containers ==="; docker ps --format '{{.Names}} {{.Image}}'
            for C in $(docker ps --format '{{.Names}}' | grep -iE 'nginx|frontend|web|proxy'); do
              echo "=== requests 1h: $C (tổng / top endpoint / theo phương thức) ==="
              docker logs --since 1h "$C" 2>&1 | grep -E '"(GET|POST|PUT|PATCH|DELETE) ' > /tmp/req.log || true
              wc -l < /tmp/req.log
              awk '{match($0,/"(GET|POST|PUT|PATCH|DELETE) [^ ]+/); r=substr($0,RSTART+1,RLENGTH-1); sub(/\?.*/,"",r); gsub(/[0-9a-f]{8}-[0-9a-f-]{27}/,":id",r); print r}' /tmp/req.log | sort | uniq -c | sort -rn | head -40
              echo "--- theo phút (đỉnh) ---"
              awk '{match($0,/[0-9]{2}\/[A-Za-z]{3}\/[0-9]{4}:[0-9]{2}:[0-9]{2}/); print substr($0,RSTART,RLENGTH)}' /tmp/req.log | sort | uniq -c | sort -rn | head -5
              rm -f /tmp/req.log
            done
