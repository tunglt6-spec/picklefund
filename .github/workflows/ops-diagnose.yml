# Chẩn đoán VPS CHỈ ĐỌC (không sửa gì): đĩa, Docker, hàng đợi việc. Chạy tay: Actions → Ops diagnose.
name: Ops diagnose
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "=== df ==="; df -h / | tail -1; docker system df
            echo "=== du top ==="; du -xsh /var/lib/docker /var/lib/containerd /var/log /opt/picklefund /root /home /var/lib/postgresql /tmp 2>/dev/null | sort -rh
            echo "=== containerd top ==="; du -xh --max-depth=3 /var/lib/containerd 2>/dev/null | sort -rh | head -6
            echo "=== journal ==="; journalctl --disk-usage
            DB=$(docker ps --format '{{.Names}}' | grep -i db | head -1)
            Q() { docker exec "$DB" sh -c "psql -U \${POSTGRES_USER:-picklefund} -d \${POSTGRES_DB:-picklefund} -At -F ' | ' -c \"$1\""; }
            echo "=== queue ==="; Q "select (select count(*) from workflow_runs where status in ('PENDING','RUNNING','WAITING_APPROVAL')) wf, (select count(*) from ai_actions where status in ('PENDING_APPROVAL','RETRY_PENDING')) ai, (select count(*) from ai_actions where status='EXPIRED') expired"
            echo "=== pending by type ==="; Q "select status, trigger_type, count(*), min(created_at)::date from workflow_runs where status in ('PENDING','RUNNING','WAITING_APPROVAL') group by 1,2 order by 3 desc"
            echo "=== images ==="; docker images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}' | head -20
