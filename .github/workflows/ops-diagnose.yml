# Chẩn đoán VPS CHỈ ĐỌC (không sửa gì): đĩa, Docker, hàng đợi việc. Chạy tay: Actions → Ops diagnose.
name: Ops diagnose
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "=== /var/log top ==="; du -xh --max-depth=2 /var/log 2>/dev/null | sort -rh | head -12
            echo "=== journal ==="; journalctl --disk-usage 2>&1
            echo "=== unused images (dangling + not used by containers) ==="; docker images -f dangling=true --format '{{.ID}} {{.Size}}'; docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' | head -0
            echo "=== containers ==="; docker ps --format '{{.Names}} {{.Image}}'
            echo "=== expire logic in code? ==="; grep -rn "EXPIRED" /opt/picklefund/backend/src --include=*.ts -l 2>/dev/null | head -5
