# Dọn đĩa VPS an toàn: chỉ journal systemd (giữ ≤300MB/14 ngày) + image Docker mồ côi. KHÔNG đụng volume, DB, backups, container.
name: Ops cleanup
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "=== trước ==="; df -h / | tail -1; journalctl --disk-usage
            journalctl --vacuum-size=300M --vacuum-time=14d
            mkdir -p /etc/systemd/journald.conf.d
            printf '[Journal]\nSystemMaxUse=300M\nMaxRetentionSec=14day\n' > /etc/systemd/journald.conf.d/picklefund.conf
            systemctl restart systemd-journald || true
            docker image prune -a -f --filter "until=1h"
            echo "=== sau ==="; df -h / | tail -1; journalctl --disk-usage
