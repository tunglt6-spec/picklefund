server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache index.html and service worker — must always be fresh
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  # PWA: script đăng ký SW + web manifest cũng PHẢI luôn tươi. Nếu để rơi vào
  # `location /` (không set Cache-Control), Cloudflare tự áp Browser TTL 4h + cache
  # ở edge (HIT) → client kẹt SW/manifest cũ tới khi hết TTL. Set no-cache để
  # Cloudflare BYPASS (đã kiểm chứng với /sw.js).
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  # Vite hashed assets (e.g. assets/index-abc123.js) — safe to cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
